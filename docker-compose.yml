services:
  wireguard:
    build: .
    container_name: wireguard
    restart: unless-stopped

    # Network capabilities required for the VPN
    cap_add:
      - NET_ADMIN

    # Kernel parameters for IP forwarding
    sysctls:
      - net.ipv4.ip_forward=1

    ports:
      - "51820:51820/udp"

    environment:
      - SERVER_ENDPOINT=vpn.example.com   # what your devices dial
      - PEERS=alice,bob                   # keys, addresses and configs are generated

    # Persistent storage for keys, peer configs and the peers file
    volumes:
      - ./volumes/config:/etc/wireguard
